<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Medi-Tee</title>
        <link rel="stylesheet" href="style.css" type="text/css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <div id="pop">
            <div id="tex">
                <h1>First to the Tee</h1>
                <p>Enter your desired tee time below and hit enter at 7AM</p>
            </div>
            <form id="teeform">
                <input type="time" id="appt" name="appt" min="07:30" max="16:35" required>
                <button type="submit" id="teetime">Enter</button>
            </form>
        </div>
    </body>
</html>
